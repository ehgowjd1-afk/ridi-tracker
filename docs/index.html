<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>리디 트래커</title>
<!-- ?v= 뒤 숫자는 파일을 고칠 때마다 올립니다.
     이렇게 해야 브라우저가 낡은 파일을 계속 쓰지 않고 새 파일을 받아옵니다. -->
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <h1 class="logo">리디 트래커</h1>
    <div class="topmeta">
      <span id="asof">불러오는 중…</span>
      <button id="themeBtn" class="ghost" title="밝게/어둡게">◐</button>
    </div>
  </div>
  <!-- 웹소설·E북·웹툰 탭은 데이터를 읽은 뒤 app.js가 앞쪽에 만들어 넣습니다.
       세 가지는 리디에서 순위를 매기는 기준 자체가 다르므로 섞지 않습니다. -->
  <nav class="wrap tabs" id="mainTabs">
    <button data-view="move">변동</button>
    <button data-view="keyword">키워드</button>
    <button data-view="event">이벤트</button>
    <button data-view="search">검색</button>
  </nav>
</header>

<main class="wrap" id="main">

  <!-- ── 랭킹 ─────────────────────────────────────────── -->
  <section id="view-rank" class="view">
    <div class="controls">
      <!-- 장르는 버튼으로 펼쳐 둡니다. 드롭다운에 넣으면 BL처럼 뒤에 있는 항목이
           아예 없는 것처럼 보입니다. -->
      <div class="seg" id="groupPick"></div>
      <div class="row">
        <select id="subPick" aria-label="세부 장르"></select>
      </div>
      <div class="seg small" id="periodPick"></div>
      <label class="chk"><input type="checkbox" id="hideAdult"> 성인 작품 숨기기</label>
    </div>
    <div id="rankHead" class="listhead"></div>
    <ol id="rankList" class="booklist"></ol>
  </section>

  <!-- ── 변동 ─────────────────────────────────────────── -->
  <section id="view-move" class="view hidden">
    <div class="controls">
      <div class="row">
        <select id="movePick" aria-label="랭킹 선택"></select>
      </div>
      <div class="seg small" id="moveKind">
        <button data-kind="rise" class="on">최고 급상승</button>
        <button data-kind="new">신규 진입</button>
        <button data-kind="out">순위권 이탈</button>
      </div>
    </div>
    <div id="moveHead" class="listhead"></div>
    <ol id="moveList" class="booklist"></ol>
  </section>

  <!-- ── 키워드 ───────────────────────────────────────── -->
  <section id="view-keyword" class="view hidden">
    <div class="controls">
      <div class="seg" id="kwSecPick"></div>
      <div class="seg" id="kwGroupPick"></div>
      <div class="row">
        <select id="kwSubPick" aria-label="세부 장르"></select>
      </div>
      <div class="seg small" id="kwPeriodPick"></div>
      <div class="row">
        <label class="field">
          <span>시점</span>
          <select id="kwWhen" aria-label="시점"></select>
        </label>
        <label class="field narrow">
          <span>몇 위까지</span>
          <input type="number" id="kwTopN" min="1" max="200" step="1" value="100">
        </label>
      </div>
      <label class="chk"><input type="checkbox" id="kwHideAdult"> 성인 작품 제외</label>
    </div>
    <div id="kwHead" class="listhead"></div>
    <div id="kwBody"></div>
  </section>

  <!-- ── 이벤트 ───────────────────────────────────────── -->
  <section id="view-event" class="view hidden">
    <div class="controls">
      <input type="search" id="eventQ" placeholder="이벤트 제목 검색">
      <div class="seg small" id="eventSort">
        <button data-sort="end" class="on">종료 임박순</button>
        <button data-sort="start">최근 시작순</button>
      </div>
    </div>
    <div id="eventHead" class="listhead"></div>
    <div id="eventList" class="eventlist"></div>
  </section>

  <!-- ── 검색 ─────────────────────────────────────────── -->
  <section id="view-search" class="view hidden">
    <div class="controls">
      <input type="search" id="searchQ" placeholder="작품 제목 · 작가 이름으로 검색">
      <p class="hint" id="searchHint">모아둔 데이터 전체에서 찾습니다.</p>
    </div>
    <ol id="searchList" class="booklist"></ol>
  </section>

</main>

<!-- ── 작품 상세 ──────────────────────────────────────── -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheetbg" data-close></div>
  <div class="sheetbox">
    <button class="sheetclose" data-close aria-label="닫기">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="xlsx.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
