name: AI 분석 예시·인용에 원문 붙이기 (한 번)

# 2026-10-17 전에 만든 AI 리뷰 분석(reviews_ai)·독자 반응 요약(reviews_sum)의 예시 발췌와 인용 구절에
# 리뷰 원문 전체를 붙입니다(화면에서 '전체' 단추로 펼쳐 보기). AI를 쓰지 않고 리뷰만 다시 받습니다.
# 다 붙이면 이 파일은 지워도 됩니다.
on:
  workflow_dispatch:
    inputs:
      max_works:
        description: "이번에 손볼 작품 수 상한"
        type: string
        default: "1000"

permissions:
  contents: write

concurrency:
  group: ai-reviews
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 원문 붙이기
        timeout-minutes: 55
        env:
          MAX_WORKS: ${{ inputs.max_works || '1000' }}
        run: node scripts/ai/quotes_fill.mjs --max-works "$MAX_WORKS"

      - name: 결과 저장(커밋)
        if: always()
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data/reviews_ai docs/data/reviews_sum
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -q -m "AI 분석 예시·인용에 리뷰 원문 전체 붙임"
          for i in 1 2 3 4 5; do
            if git push; then echo "저장 완료"; exit 0; fi
            echo "다른 수집과 겹쳤습니다. 합치고 다시 시도 ($i/5)"
            git pull --rebase -q || { git rebase --abort; sleep 5; }
            sleep $((i * 5))
          done
          echo "저장 실패"; exit 1
