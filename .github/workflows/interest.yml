name: 리디 관심 수

# 하루 한 번: BL 웹툰 카테고리 전체 목록(완결·회차·작가) + 전 작품 '관심' 수를 모읍니다.
#   docs/data/bl_webtoon/list.json        카테고리 목록 (순위 밖 최근 완결작 찾기용)
#   docs/data/interest/<월>/<NN>.json     작품별 날짜별 관심 수 (전 작품 별점 rc 파일과 같은 꼴)
# 관심 수는 GraphQL로 100작품씩 묶어 받아 가볍습니다(약 3만 작품 ≈ 300요청 ≈ 10분).
on:
  schedule:
    - cron: "40 20 * * *"     # 한국시간 05:40 (매일 수집 08:15 전)
  workflow_dispatch:
    inputs:
      max_requests:
        description: "관심 수 요청 수 상한 (100작품/요청)"
        type: string
        default: "400"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  interest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 관심 수 수집
        timeout-minutes: 35
        env:
          MAXR: ${{ inputs.max_requests || '400' }}
        run: |
          python scripts/interest.py --max-requests "$MAXR"

      - name: 결과 저장(커밋)
        if: always()
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data/bl_webtoon docs/data/interest
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "관심 수: $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5; do
            if git push; then echo "저장 완료"; exit 0; fi
            echo "다른 수집과 겹쳤습니다. 합치고 다시 시도 ($i/5)"
            git fetch origin main
            git merge -X ours origin/main -m "동시에 돈 수집 결과 합치기" || exit 1
          done
          echo "여러 번 시도했지만 저장하지 못했습니다."
          exit 1
